name: Evals

# Two jobs:
#   structural — typecheck + no-API wiring checks (shipped prompts/hooks/fixtures
#                load and carry their rules). Always runs, no secret, free.
#   live       — the behavioral suites that call the model. Gated on an
#                ANTHROPIC_API_KEY secret, so forks (and repos without the secret)
#                skip cleanly rather than fail. Costs a few cents per run.

on:
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "system-prompt.md"
      - "system-prompt-bee-processor.md"
      - ".kiro/hooks/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "evals/**"
      - "system-prompt.md"
      - "system-prompt-bee-processor.md"
      - ".kiro/hooks/**"
  workflow_dispatch: {}

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: evals
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: evals
        run: npx tsc --noEmit
      - name: Structural check (no API)
        working-directory: evals
        run: npm run check

  live:
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for API key
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping live evals (expected on forks). Structural checks already ran."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        working-directory: evals
        run: npm install --no-audit --no-fund

      - name: Run eval suites
        if: steps.gate.outputs.run == 'true'
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Override the eval model here if needed (default: claude-sonnet-5).
          # EVAL_MODEL: claude-sonnet-5
        run: npm run eval
